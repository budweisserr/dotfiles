# AeroSpace config — macOS port of ~/.config/awesome
#
# Modifier note: AeroSpace binds to `alt` (Option), not `cmd`. On macOS `cmd`
# is the app-shortcut modifier (cmd-q, cmd-w, cmd-tab, cmd-1...), so a WM bound
# to it swallows app shortcuts. Translation rule: Linux `Super` -> `alt`.
#
# Reads from: ~/.config/aerospace/aerospace.toml (or ~/.aerospace.toml, not both)
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 24
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# 9 always-alive workspaces, mirroring the 9 tags in awesome/config/tags.lua
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# ---------------------------------------------------------------------------
# main mode
# ---------------------------------------------------------------------------
[mode.main.binding]

    # launcher — awesome: Super+Return, Super+r, Print
    alt-enter = 'exec-and-forget open -na kitty'
    alt-r     = 'exec-and-forget open -a Raycast'
    alt-p     = 'exec-and-forget open -a Flameshot'

    # focus — awesome: Super+Tab, Super+Escape
    alt-h      = 'focus left'
    alt-j      = 'focus down'
    alt-k      = 'focus up'
    alt-l      = 'focus right'
    alt-tab    = 'focus-back-and-forth || workspace-back-and-forth'
    alt-escape = 'workspace-back-and-forth'

    # move windows — awesome: Super+Shift+j/k (swap.byidx)
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # resize — awesome: Super+h/l (incmwfact)
    alt-minus       = 'resize smart -50'
    alt-equal       = 'resize smart +50'
    alt-shift-equal = 'balance-sizes'
    alt-s           = 'mode resize'

    # layout — awesome: Super+space, Super+Ctrl+space
    alt-slash   = 'layout tiles horizontal vertical'
    alt-comma   = 'layout accordion horizontal vertical'
    alt-space   = 'layout tiles accordion'
    alt-shift-f = 'layout floating tiling'

    # window state — awesome: Super+f, Super+Up, Super+Down, Super+n, Alt+F4
    alt-f      = 'fullscreen'
    alt-ctrl-f = 'macos-native-fullscreen'
    alt-m      = 'macos-native-minimize'
    alt-w      = 'close'

    # monitors — awesome: Super+q, Super+w, Super+Ctrl+j
    alt-ctrl-h    = 'focus-monitor prev'
    alt-ctrl-l    = 'focus-monitor next'
    alt-shift-tab = 'move-node-to-monitor --wrap-around next'
    alt-ctrl-tab  = 'move-workspace-to-monitor --wrap-around next'

    # workspaces — awesome: Super+1..9, Super+Shift+1..9
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    alt-shift-semicolon = 'mode service'

# ---------------------------------------------------------------------------
# resize mode — alt-s, esc/enter to leave
# ---------------------------------------------------------------------------
[mode.resize.binding]
    h     = 'resize width -50'
    l     = 'resize width +50'
    j     = 'resize height -50'
    k     = 'resize height +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    esc   = 'mode main'
    enter = 'mode main'

# ---------------------------------------------------------------------------
# service mode — alt-shift-semicolon
# ---------------------------------------------------------------------------
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']
    f         = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

